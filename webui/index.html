<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#236449" />
    <meta
      name="description"
      content="CommuniBuy 社区团购平台：发现社区好物，和邻居一起买好日常。"
    />
    <title>社区团购平台 · CommuniBuy</title>
    <style>
      .startup-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f8f9f5;
        color: #233a31;
        font-family: Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif;
      }
      .startup-card {
        width: min(100%, 420px);
        text-align: center;
      }
      .startup-spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 24px;
        border: 3px solid #d4e2d7;
        border-top-color: #236449;
        border-radius: 50%;
        animation: startup-spin 1s linear infinite;
      }
      .startup-card h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.5;
      }
      .startup-card p {
        margin: 0;
        color: #657565;
        font-size: 14px;
        line-height: 1.8;
      }
      .startup-retry {
        margin-top: 24px;
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        background: #236449;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      .startup-retry[hidden] {
        display: none;
      }
      .startup-retry:focus-visible {
        outline: 3px solid #73904a;
        outline-offset: 4px;
      }
      .startup-screen[data-state='failed'] .startup-spinner {
        animation: none;
        border-color: #c4d1be;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <section id="startup-screen" class="startup-screen" aria-busy="true">
        <div class="startup-card" role="status" aria-live="polite">
          <div class="startup-spinner" aria-hidden="true"></div>
          <h1 id="startup-title">正在进入社区团购平台</h1>
          <p id="startup-description">正在加载页面，请稍候。</p>
          <button id="startup-retry" class="startup-retry" type="button" hidden>
            重新加载页面
          </button>
        </div>
      </section>
    </div>
    <noscript>请启用浏览器的 JavaScript 后重新加载社区团购平台。</noscript>
    <script>
      ;(function () {
        const screen = document.getElementById('startup-screen')
        const title = document.getElementById('startup-title')
        const description = document.getElementById('startup-description')
        const retry = document.getElementById('startup-retry')
        let finished = false
        let failed = false
        const slowTimer = window.setTimeout(function () {
          if (finished || failed) return
          title.textContent = '页面加载较慢'
          description.textContent = '仍在加载中，请稍候；如果长时间没有变化，请检查网络连接。'
        }, 10000)
        function showFailure() {
          if (finished || failed) return
          failed = true
          window.clearTimeout(slowTimer)
          screen.dataset.state = 'failed'
          screen.setAttribute('aria-busy', 'false')
          title.textContent = '页面暂时无法加载'
          description.textContent = '页面资源加载或初始化失败，请检查网络连接后重新加载。'
          retry.hidden = false
        }
        function onError(event) {
          if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement)
            showFailure()
        }
        function finish() {
          finished = true
          window.clearTimeout(slowTimer)
          window.removeEventListener('error', onError, true)
          window.removeEventListener('unhandledrejection', showFailure)
          window.removeEventListener('communibuy:startup-error', showFailure)
          window.removeEventListener('communibuy:ready', finish)
        }
        retry.addEventListener('click', function () {
          window.location.reload()
        })
        window.addEventListener('error', onError, true)
        window.addEventListener('unhandledrejection', showFailure)
        window.addEventListener('communibuy:startup-error', showFailure)
        window.addEventListener('communibuy:ready', finish)
      })()
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
